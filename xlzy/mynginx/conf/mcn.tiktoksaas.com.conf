server {
    listen       80;
    server_name  mcn.tiktoksaas.org;

    # SPA 静态文件根目录
    root   /usr/share/nginx/html/mcn.tiktoksaas.com/dist;
    index  index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 静态资源（带 hash 的文件名）设置长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # favicon 和 version.json
    location ~ ^/(favicon\.ico|version\.json)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # API 反向代理：避免跨域，将 /baseapi 转发到后端
    location /baseapi/ {
        proxy_pass http://mcn-api.tiktoksaas.org/;
        proxy_set_header Host mcn-api.tiktoksaas.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 图片 CDN 反向代理：解决 s.500fd.com 跨域问题
    location /tt_product/ {
        proxy_pass https://s.500fd.com;
        proxy_ssl_server_name on;
        # ✅ 关键：模拟 curl 的 TLS 指纹
        proxy_ssl_protocols TLSv1.2;
        proxy_ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256;
        proxy_set_header Host s.500fd.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET,POST,OPTIONS,PUT,DELETE" always;
    }

    # SPA 路由：所有请求都 fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 错误页
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
